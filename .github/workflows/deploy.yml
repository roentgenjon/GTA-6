name: Deploy (automatisch bei jedem Push)

# Jeder Push veröffentlicht sofort eine neue Version der Seite (Branch gh-pages).
# Pages-Quelle: Settings → Pages → "Deploy from a branch" → gh-pages / (root).
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-pages-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax-Check der Module
        run: |
          for f in src/*.js; do node --check "$f" || exit 1; done

      - name: Seite bauen (Versionsstempel + Cache-Busting)
        run: |
          set -e
          V="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          mkdir -p dist
          cp index.html styles.css dist/
          cp -r src vendor dist/
          touch dist/.nojekyll
          # an alle relativen Modul-Importe ?v=<Version> hängen → Browser laden garantiert die neuen Dateien
          sed -i -E "s#(from '\./[A-Za-z0-9_]+\.js)'#\1?v=${V}'#g" dist/src/*.js
          sed -i "s#src/main.js#src/main.js?v=${V}#; s#styles.css#styles.css?v=${V}#; s#__BUILD__#${V}#g" dist/index.html
          printf '{"v":"%s","sha":"%s","time":"%s"}\n' "$V" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/version.json
          echo "Version $V"
          grep -c "?v=${V}" dist/src/main.js

      - name: Auf gh-pages veröffentlichen
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
